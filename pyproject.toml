[project]
name = "mnemo"
version = "0.1.0"
description = "Persistent, portable, cross-AI memory over a markdown vault — with push-based auto-recall (MCP + CLI)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Emir Furkan Sarı" }]
keywords = ["memory", "mcp", "obsidian", "rag", "llm", "ai", "persistent-memory"]
dependencies = [
    "python-frontmatter>=1.1.0",
]

[project.optional-dependencies]
embed = [
    "fastembed>=0.4",
    "sqlite-vec>=0.1.6",
]
mcp = [
    "mcp>=1.2.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mnemo = "mnemo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemo"]
