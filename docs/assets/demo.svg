<text x="338" y="11" fill="#8b949e" font-size="12.5" text-anchor="middle">mnemo — persistent cross-AI memory 🐠</text>
<text class="l0" y="60"><tspan x="20" fill="#3fb950">$ </tspan><tspan x="37" fill="#e6edf3">mnemo write --type decision --title "RF update is sequential" \</tspan></text>
<text class="l1" y="83"><tspan x="20" fill="#e6edf3">    --summary "Devices update one at a time — prevents lockup."</tspan></text>
<text class="l2" y="106"><tspan x="20" fill="#8b949e">{"action": "created", "id": "20260623-rf-update-is-sequential"}</tspan></text>
<text class="l3" y="129"></text>
<text class="l4" y="152"><tspan x="20" fill="#3fb950">$ </tspan><tspan x="37" fill="#e6edf3">mnemo search "rf update order"</tspan></text>
<text class="l5" y="175"><tspan x="20" fill="#8b949e">[0.033] </tspan><tspan x="89" fill="#e6edf3">RF update is sequential  </tspan><tspan x="304" fill="#39c5cf">(decision/stm32-rf-ota)</tspan></text>
<text class="l6" y="198"><tspan x="20" fill="#8b949e">        Devices update one at a time — prevents system lockup.</tspan></text>
<text class="l7" y="221"></text>
<text class="l8" y="244"><tspan x="20" fill="#8b949e">── next day · new session · you type nothing ──────────────</tspan></text>
<text class="l9" y="267"><tspan x="20" fill="#3fb950">$ </tspan><tspan x="37" fill="#e6edf3">claude   </tspan><tspan x="115" fill="#8b949e"># SessionStart hook → mnemo recall fires</tspan></text>
<text class="l10" y="290"><tspan x="20" fill="#ff8a3d">## 🧠 mnemo recall — project: stm32-rf-ota</tspan></text>
<text class="l11" y="313"><tspan x="20" fill="#e6edf3">### Recent decisions</tspan></text>
<text class="l12" y="336"><tspan x="20" fill="#e6edf3">- [</tspan><tspan x="46" fill="#58a6ff">20260623-rf-update-is-sequential</tspan><tspan x="321" fill="#e6edf3">] RF update is sequential</tspan></text>
<text class="l13" y="359"><tspan x="20" fill="#e6edf3">- [</tspan><tspan x="46" fill="#58a6ff">20260623-discover-ack-grows-to-18-bytes</tspan><tspan x="381" fill="#e6edf3">] DISCOVER_ACK → 18 bytes</tspan></text>
<text class="l14" y="382"><tspan x="20" fill="#e6edf3">### Lessons / past mistakes</tspan></text>
<text class="l15" y="405"><tspan x="20" fill="#e6edf3">- [</tspan><tspan x="46" fill="#58a6ff">20260623-don-t-hash-the-uid</tspan><tspan x="278" fill="#e6edf3">] Don't hash the UID — raw 96-bit STM32 UID</tspan></text>
<text class="l16" y="428"></text>
<text class="l17" y="451"><tspan x="20" fill="#3fb950">✓ AI starts already knowing your past work. You typed nothing.</tspan></text>
